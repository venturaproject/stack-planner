; This image is immutable — code only changes via a rebuilt image, never by
; editing files under a running container — so opcache has no reason to ever
; re-stat included files. The extension's own default (validate_timestamps=1,
; re-checking mtimes on every included file) is a dev-mode assumption; the fix
; here is the same shape as opcache-dev.ini's but taken all the way to 0,
; since there's no live-editing workflow to preserve in prod.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
