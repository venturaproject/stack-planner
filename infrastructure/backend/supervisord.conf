[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Restarted automatically by supervisor if the worker exits (crash, OOM, or
; the --time-limit below) — that periodic recycling is why this runs under
; supervisor instead of just `exec`-ing the console command directly.
[program:outbox-consume]
command=php /app/bin/console app:outbox:consume --time-limit=3600 --sleep=250 --no-debug
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:messenger-consume]
command=php /app/bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --no-debug
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
