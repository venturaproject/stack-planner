# Blanket, IP-based safety net for every /api/ endpoint — defense in depth
# alongside (not a replacement for) the tighter, per-endpoint rate limiters
# already enforced in Symfony for login/refresh/token issuance.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.prod.conf;

    location /media/ {
        alias /srv/media/;
        try_files $uri =404;
    }

    location /bundles/ {
        alias /app/public/bundles/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.prod.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        # $proxy_add_x_forwarded_for APPENDS this hop's own $remote_addr to any
        # inbound X-Forwarded-For, rather than passing the client-supplied header
        # through raw — the backend (config/packages/framework.yaml's
        # trusted_proxies: private_ranges) walks that list from the right and
        # stops at the first non-private entry, so a client can prepend as many
        # forged IPs as it wants without changing what Symfony resolves as the
        # real client IP.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_read_timeout 60;
        client_max_body_size 10M;
    }

    # Hashed filenames (Vite's content-hash asset names) are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.prod.conf;
    }

    # SPA fallback: any non-API, non-asset route resolves to index.html so
    # React Router can handle client-side routing.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.prod.conf;
    }
}
