# See security-headers.prod.conf's comment — same inheritance footgun applies
# here. No HSTS in dev: it would "stick" in the browser for its max-age and
# force HTTPS on localhost long after this container is gone.
add_header X-Frame-Options         "DENY"                              always;
add_header X-Content-Type-Options  "nosniff"                           always;
add_header X-XSS-Protection        "1; mode=block"                     always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
