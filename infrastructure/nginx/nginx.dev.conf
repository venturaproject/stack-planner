# Blanket, IP-based safety net for every /api/ endpoint — defense in depth
# alongside (not a replacement for) the tighter, per-endpoint rate limiters
# already enforced in Symfony for login/refresh/token issuance.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Avoid recording signed activation/reset-link query strings in local logs too.
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log no_query;

    include /etc/nginx/snippets/security-headers.dev.conf;

    location /media/ {
        alias /srv/media/;
        try_files $uri =404;
    }

    location /bundles/ {
        alias /app/public/bundles/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.dev.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        # See nginx.prod.conf's comment — same fix applied here for dev/prod parity.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_read_timeout 60;
        client_max_body_size 10M;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
