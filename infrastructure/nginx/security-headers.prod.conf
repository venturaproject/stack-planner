# nginx's `add_header` does NOT inherit into a location block that declares
# its own `add_header` (e.g. Cache-Control) — it silently drops every header
# inherited from the server block instead of adding to them. `include` this
# file in server{} AND in every location{} that sets its own add_header, so
# these directives are actually re-declared in that context rather than lost.
add_header X-Frame-Options         "DENY"                              always;
add_header X-Content-Type-Options  "nosniff"                           always;
add_header X-XSS-Protection        "1; mode=block"                     always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
