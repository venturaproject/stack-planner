; Docker Desktop for Mac's bind-mounted filesystem (backend/ -> /app) is far slower
; per-syscall than a native filesystem. PHP's defaults assume a fast local disk:
; opcache.enable_cli=0 means every CLI command recompiles ~9000 files from scratch
; on that slow mount (measured: ~13s just to boot `bin/console about`), and the
; default revalidate_freq=2 has php-fpm re-stat every included file every 2s, which
; on this mount is still expensive enough to show up as multi-hundred-ms overhead
; per request. Keeping validate_timestamps on (not 0) so edited code still reloads
; automatically — just checked less aggressively.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=10
realpath_cache_size=4096K
realpath_cache_ttl=600
